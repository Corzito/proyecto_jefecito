{% extends 'base.html' %}
{% block title %}Editar Correo Jefe{% endblock %}
{% block content %}
<div class="container mt-4" style="max-width:600px;">
    <div class="card shadow-sm border-0">
        <div class="card-header text-white py-3" style="background-color:#E32822;">
            <h5 class="mb-0 fw-bold">
                <i class="fas fa-edit me-2"></i>Editar Correo — {{ nombre_jefe }}
            </h5>
        </div>
        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}
                <input type="hidden" name="nombre_jefe" value="{{ nombre_jefe }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Jefe Inmediato</label>
                    <input type="text" class="form-control" value="{{ nombre_jefe }}" disabled>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Correo electrónico</label>
                    <input type="email" name="correo_jefe" class="form-control"
                           value="{{ correo_actual }}"
                           placeholder="correo@empresa.com">
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="fas fa-save me-1"></i>Guardar
                    </button>
                    <a href="{% url 'periodo:lista_jefes' %}" class="btn btn-outline-secondary px-4">
                        <i class="fas fa-arrow-left me-1"></i>Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
